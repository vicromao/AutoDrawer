name: CI/CD

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile check
        run: python -m py_compile AutoDrawer.py pacing.py prefs.py ui.py vectorize.py

      - name: Headless tests
        run: python -m unittest discover -s tests -t . -v

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Package source archive
        run: |
          git archive --format=zip --output="AutoDrawer-${{ github.ref_name }}.zip" HEAD
          sha256sum "AutoDrawer-${{ github.ref_name }}.zip" > SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AutoDrawer-*.zip
            SHA256SUMS.txt
